# Настройки для запуска на компьютере ассоциации. Токен НЕ пишите сюда:
# программа спросит его при запуске.
# Настройки модуля передачи сведений о договорах из ЕИС в НОСТРОЙ.
# Скопируйте в config.toml и заполните. Токен не храните в репозитории:
# его можно задать переменной окружения EIS_TOKEN.

[sro]
name = "Ассоциация СРО «Стройкорпорация»"
reg_number = "СРО-С-130-21122009"

[paths]
members = "data/members.xlsx"          # ИНН, наименование, дата уровня ОДО
cache_dir = "data/cache"               # скачанные архивы ЕИС
work_dir = "data/work"                 # найденные договоры (JSONL)
output_dir = "data/out"                # выгрузки для оператора и НОСТРОЙ
# Необязательные дополнительные источники (CSV/XLSX), см. README
finpod_import = ""                     # выгрузка «Финподдержки»
member_notices = ""                    # уведомления членов по регламенту
nostroy_registry = ""                  # уже переданные в НОСТРОЙ сведения

[period]
# Начало периода сверки. Для конкурентных договоров модуль дополнительно
# берёт дату уровня ОДО члена, но не ранее этой даты.
competitive_from = "2017-07-01"
noncompetitive_from = "2026-03-01"

[eis]
# Тип доступа: "IP" — физическое лицо, "LE" — юридическое лицо.
access = "IP"
token = ""                             # или переменная окружения EIS_TOKEN
# Имя элемента токена в SOAP-заголовке и HTTP-заголовке при скачивании архива.
# Для физлица по открытым примерам — individualPerson_token.
# Для юрлица проверьте по Альбому ТФФ ЕИС.
token_header = "individualPerson_token"
mode = "PROD"
timeout_sec = 60
# Не более 5000 запросов в час на пользователя (инструкция ЕИС): 0,75 с — 4800 в час.
min_interval_sec = 0.75
# Сколько дней заказывать в ЕИС одной пачкой: архивы всех дней готовятся одновременно.
days_batch = 7
# Потоков для запросов и скачивания архивов (частота запросов всё равно не выше min_interval_sec).
post_workers = 4
archive_retries = 6
# При обрыве связи ждать её восстановления до N минут, а не пропускать дни.
net_wait_max_min = 60
# false — ходить в ЕИС напрямую, мимо прокси/VPN из настроек Windows.
use_system_proxy = true
archive_retry_wait_sec = 20
# false — удалять архивы дня сразу после разбора: найденные договоры остаются в data/work,
# отметка .done остаётся (день не скачивается снова). Если изменится список членов СРО или
# правила разбора, очищенные дни скачаются заново сами. true — хранить все архивы (сотни ГБ).
# Уже накопленные архивы удаляет «25 Освободить диск от разобранных архивов.bat».
keep_archives = false

# Коды регионов заказчиков (как в ЕИС). "all" — все регионы России: договоры
# членов СРО ищутся у заказчиков по всей стране, а не только в Москве и области.
# Дни, уже скачанные по Москве (77) и области (50), повторно не запрашиваются.
regions = ["all"]

[eis.endpoints]
# С 2025 года ЕИС отдаёт данные 44-ФЗ и 223-ФЗ через один сервис getDocsIP
# (getDocsLE отвечает 404). Адрес проверен по WSDL 22.10.2026.
IP_44  = "https://int.zakupki.gov.ru/eis-integration/services/getDocsIP"
IP_223 = "https://int.zakupki.gov.ru/eis-integration/services/getDocsIP"

[[eis.feeds]]
law = "44"
endpoint_law = "44"
subsystem = "RGK"
document_types = ["contract"]

[[eis.feeds]]
law = "615"
endpoint_law = "44"
subsystem = "RD615"
# Договоры ПП-615 ЕИС отдаёт под типом pprf615Contract (проверено probe615 03.11.2026);
# тип contract в подсистеме RD615 всегда пустой.
document_types = ["pprf615Contract"]

# Договоры 223-ФЗ. В большинстве из них (тип contractCutted) поставщик не указан.
# Для договора со строительными ОКПД2 (41, 42, 43 — то, что вносится в реестр
# НОСТРОЙ) модуль запрашивает протоколы закупки по её номеру
# (getDocsByReestrNumber, RI223) и находит победителя — члена СРО.
# Это 2 запроса на регион в день плюс по запросу на каждую строительную закупку.
[[eis.feeds]]
law = "223"
endpoint_law = "223"
subsystem = "RD223"
# contractCutted — публичная версия договора без сведений о поставщике.
document_types = ["contract", "contractCutted"]
regions = ["all"]
lookup_protocols = true

[grk]
# Только договоры по Градостроительному кодексу (строительство, реконструкция,
# капремонт, снос). 44-ФЗ — по ИКЗ: цифры 30–33 (ОКПД2 41.2/42/43) и 34–36
# (КВР 243 — капремонт, 4xx — капвложения). 223-ФЗ — по ОКПД2 позиций договора.
# Договоры с ОКПД2 не из строительства не сохраняются; «Вероятно ГрК»
# (строительный ОКПД2 при другом КВР, например 244) сохраняются для проверки.
only = true
# Не включать в сверку договоры текущего ремонта, содержания и обслуживания
# (распознаются по предмету договора, см. grk.py). false — включать, как раньше.
exclude_current_repair = true
# КВР (цифры 34–36 ИКЗ), при которых договор со строительным ОКПД2 относится к ГрК.
# 12.11.2026, указание СРО: 243 — капитальный ремонт; 407, 413, 414 — капитальное строительство.
# Договоры с другим КВР попадают в «Требуют решения».
kvr_grk = ["243", "407", "413", "414"]
# 13.11: позиция СРО — КВР 244 = текущий ремонт, такие договоры исключаются ([] — выключить)
kvr_not_grk = ["244"]

[matching]
date_tolerance_days = 3
price_tolerance_pct = 1.0

[alerts]
# Оповещения о сбоях и итогах прогона. Оставьте пустым, чтобы отключить.
telegram_bot_token = ""
telegram_chat_id = ""
smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
email_to = ""

[nostroy]
# Спецификация API НОСТРОЙ для СРО пока не опубликована. До её получения
# модуль готовит файлы для загрузки оператором (mode = "file").
mode = "file"
api_url = ""
api_token = ""
